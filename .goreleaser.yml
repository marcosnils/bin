version: 2

before:
  hooks:
    - go mod download
builds:
  - id: bin
    env:
    - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
  # Android needs cgo and the NDK's clang (android API 28). Set
  # ANDROID_NDK_HOME or use `make release`, which installs the NDK.
  - id: android
    env:
    - CGO_ENABLED=1
    - CC={{ .Env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/{{ .Runtime.Goos }}-x86_64/bin/aarch64-linux-android28-clang
    - CXX={{ .Env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/{{ .Runtime.Goos }}-x86_64/bin/aarch64-linux-android28-clang++
    goos:
      - android
    goarch:
      - arm64
archives:
  - format: binary
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
